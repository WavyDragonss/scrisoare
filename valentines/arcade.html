<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kawaii Arcade</title>
  <link rel="stylesheet" href="css/arcade.css" />
</head>
<body>
  <div class="bg-overlay"></div>

  <main class="arcade-container">
    <div class="header">
      <h1>Kawaii Arcade 🎮✨</h1>
      <p class="subtitle">Pick a game, cutie!</p>
      <div class="kitty-decorator" aria-hidden="true">
        <span>=^.^=</span>
      </div>
    </div>

    <div class="games-grid">
      <button class="game-btn" data-game="flappyKitty">
        <span class="game-icon">🐱</span>
        <span class="game-title">Flappy Kitty</span>
        <span class="game-desc">Help Kitty fly!</span>
      </button>

      <button class="game-btn" data-game="memoryMatch">
        <span class="game-icon">🎀</span>
        <span class="game-title">Memory Match</span>
        <span class="game-desc">Find the pairs!</span>
      </button>

      <button class="game-btn" data-game="heartCollector">
        <span class="game-icon">💗</span>
        <span class="game-title">Heart Collector</span>
        <span class="game-desc">Catch the hearts!</span>
      </button>

      <button class="game-btn" data-game="balloonPop">
        <span class="game-icon">🎈</span>
        <span class="game-title">Balloon Pop</span>
        <span class="game-desc">Pop them all!</span>
      </button>

      <button class="game-btn" data-game="colorMatch">
        <span class="game-icon">🌈</span>
        <span class="game-title">Color Match</span>
        <span class="game-desc">Match the colors!</span>
      </button>

      <button class="game-btn" data-game="speedClicker">
        <span class="game-icon">⚡</span>
        <span class="game-title">Speed Clicker</span>
        <span class="game-desc">Click as fast as you can!</span>
      </button>
    </div>

    <div class="game-area" id="gameArea" style="display: none;"></div>

    <button id="backBtn" class="back-btn" style="display: none;">← Back to Menu</button>
  </main>

  <button id="playerToggle" class="player-toggle" type="button" aria-controls="musicPanel" aria-expanded="false">Music ♪</button>

  <aside id="musicPanel" class="music-panel is-collapsed" aria-label="Music player">
    <div class="panel-top">
      <p id="nowPlaying" class="now-playing">Now playing: -</p>
      <button id="panelCloseBtn" type="button" class="mini-btn">Hide</button>
    </div>

    <div class="player-controls">
      <button id="prevBtn" type="button" class="ctrl-btn">Prev</button>
      <button id="playPauseBtn" type="button" class="ctrl-btn ctrl-main">Play</button>
      <button id="nextBtn" type="button" class="ctrl-btn">Next</button>
    </div>

    <div class="progress-wrap">
      <input id="progressBar" class="progress-bar" type="range" min="0" max="1000" value="0" step="1" aria-label="Song progress" />
      <p id="timeInfo" class="time-info">00:00 / 00:00 (left 00:00)</p>
    </div>

    <div class="player-controls secondary-controls">
      <label class="track-picker-label" for="trackSelect">Track</label>
      <select id="trackSelect" class="track-select" aria-label="Select track"></select>
    </div>
  </aside>

  <audio id="bgSong" preload="metadata"></audio>

  <script src="js/arcade.js"></script>
</body>
</html>
